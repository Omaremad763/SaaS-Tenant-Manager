<div class="flex h-screen bg-slate-50 overflow-hidden font-sans">
  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-50">
    <div class="h-16 flex items-center px-6 bg-slate-950/50 border-b border-slate-800">
      <div
        class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shrink-0"
      >
        I
      </div>
      <span class="ml-3 font-extrabold text-xl tracking-wider text-white">INVENTO</span>
    </div>

    <nav class="flex-1 mt-6 px-3 space-y-2 overflow-y-auto custom-scrollbar">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-900/20"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center p-3 rounded-xl transition-all duration-200 hover:bg-slate-800 group"
      >
        <i [class]="'fa-solid fa-' + item.icon" class="text-lg w-6 text-center shrink-0"></i>
        <span class="ml-3 font-medium text-sm"> {{ item.label }} </span>
      </a>
    </nav>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header
      class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm"
    >
      <div class="flex items-center gap-4"></div>

      <div class="relative">
        <button
          (click)="isDropdownOpen = !isDropdownOpen"
          class="flex items-center gap-4 hover:bg-slate-50 p-2 rounded-lg transition-colors duration-200"
        >
          <div class="flex flex-col items-end mr-2">
            <span class="text-sm font-bold text-slate-800">Admin User</span>
            <span class="text-[10px] text-green-500 font-bold uppercase tracking-tighter"
              >● Online</span
            >
          </div>
          <div
            class="w-10 h-10 rounded-full bg-blue-100 border-2 border-white shadow-sm flex items-center justify-center text-blue-600 font-bold italic"
          >
            AU
          </div>
        </button>

        <div
          *ngIf="isDropdownOpen"
          class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-[100] animate-in fade-in slide-in-from-top-2 duration-200"
        >
          <button
            (click)="logout()"
            class="w-full flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors"
          >
            <i class="fa-solid fa-right-from-bracket mr-3"></i>
            Logout
          </button>
        </div>
      </div>
    </header>

    <section class="flex-1 overflow-y-auto p-6 md:p-8 bg-slate-50">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </section>
  </main>
</div>
