<div class="flex h-screen bg-slate-100 overflow-hidden font-sans">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-800 text-slate-300 flex flex-col border-r border-slate-700">
    <!-- Logo -->
    <div class="h-16 flex items-center px-6 border-b border-slate-700">
      <div
        class="w-8 h-8 bg-slate-600 rounded-lg flex items-center justify-center text-white font-bold"
      >
        S
      </div>
      <span class="ml-3 font-semibold text-base text-white tracking-wide"> SaaS Manager </span>
    </div>

    <!-- Menu -->
    <nav class="flex-1 mt-6 px-3 space-y-1 overflow-y-auto">
      <a
        *ngFor="let item of filteredMenuItems()"
        [routerLink]="item.route"
        routerLinkActive="bg-slate-700 text-white border-l-4 border-blue-500"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center p-3 rounded-md transition-colors duration-150 hover:bg-slate-700"
      >
        <div class="w-6 flex justify-center shrink-0">
          <i [class]="'fa-solid fa-' + item.icon" class="text-sm"> </i>
        </div>

        <span class="ml-3 text-sm font-medium">
          {{ item.label }}
        </span>
      </a>
    </nav>

    <!-- Footer -->
    <div
      class="p-4 text-[10px] text-center text-slate-400 border-t border-slate-700 uppercase tracking-wide"
    >
      v1.0.4 – System Admin
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
      <span class="text-sm font-medium text-slate-500"> Pages / Dashboard </span>

      <!-- User -->
      <div class="relative">
        <button
          (click)="toggleDropdown()"
          class="flex items-center gap-4 px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors"
        >
          <div class="flex flex-col items-end">
            <span class="text-sm font-semibold text-slate-800">
              {{ authService.currentUser()?.username || 'Admin User' }}
            </span>
            <span class="text-[11px] text-green-600 flex items-center gap-1">
              <span class="w-1.5 h-1.5 bg-green-600 rounded-full"></span>
              Online
            </span>
          </div>

          <div
            class="w-9 h-9 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-semibold"
          >
            {{ authService.currentUser()?.username?.substring(0, 2) || 'AU' | uppercase }}
          </div>
        </button>

        <!-- Dropdown -->
        <div
          *ngIf="isDropdownOpen()"
          class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-md border border-slate-200 py-2"
        >
          <div class="px-4 py-2 border-b border-slate-100">
            <p class="text-[10px] font-medium text-slate-400 uppercase">Current Role</p>
            <p class="text-sm font-semibold text-slate-700">
              {{ authService.currentUser()?.roles?.[0] }}
            </p>
          </div>

          <button
            (click)="logout()"
            class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors"
          >
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Content -->
    <section class="flex-1 overflow-y-auto p-6 bg-slate-100">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </section>
    <app-footer></app-footer>
  </main>
</div>
