<div class="p-6 bg-gray-50 min-h-screen">
  <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
    <h2 class="text-2xl font-bold text-gray-800">Shipment Management</h2>

    <div class="flex gap-4 w-full md:w-auto">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="applyFilter()"
        placeholder="Search by tracking number..."
        class="px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none w-full bg-white shadow-sm"
      />

      <select
        [(ngModel)]="statusFilter"
        (change)="applyFilter()"
        class="px-4 py-2 rounded-lg border border-gray-200 bg-white outline-none shadow-sm focus:ring-2 focus:ring-indigo-500"
      >
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>
  </div>
  <!-- Form Talble -->
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
    <table class="w-full text-left">
      <thead class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wide">
        <tr>
          <th class="px-6 py-4">Tracking Number</th>
          <th class="px-6 py-4">Receiver</th>
          <th class="px-6 py-4">Status</th>
          <th class="px-6 py-4">Created Date</th>
          <th class="px-6 py-4">Destination</th>
          <th class="px-6 py-4 text-center">Actions</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let s of filteredShipments" class="hover:bg-gray-50 transition">
          <td class="px-6 py-4 font-mono font-semibold text-indigo-600">
            {{ s.trackingNumber }}
          </td>

          <td class="px-6 py-4 text-gray-700">
            {{ s.receiverName }}
          </td>
          <td class="px-6 py-4">
            <span
              class="px-3 py-1 rounded-full text-xs font-medium"
              [ngClass]="getStatusClass(s.status)"
            >
              {{ s.status }}
            </span>
          </td>
          <td class="px-6 py-4 text-gray-500">
            {{ s.createdAt | date: 'mediumDate' }}
          </td>
          <td class="px-6 py-4 text-gray-700">
            {{ s.destination }}
          </td>
          <td class="px-6 py-4 flex justify-center gap-3">
            <button (click)="openModal(s)" class="text-blue-600 hover:underline">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="filteredShipments.length === 0 && !isLoading" class="p-20 text-center">
      <p class="text-gray-400">No shipments match your search</p>
    </div>

    <div *ngIf="isLoading" class="p-10 space-y-4">
      <div *ngFor="let i of [1, 2, 3]" class="h-12 bg-gray-100 animate-pulse rounded-lg"></div>
    </div>
  </div>

  <!-- Form Modal -->
  <div
    *ngIf="showModal"
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 backdrop-blur-sm"
    (click)="closeModal()"
  >
    <div
      class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 animate-in fade-in zoom-in duration-200 relative"
      (click)="$event.stopPropagation()"
    >
      <!-- Close Button X -->
      <button
        (click)="closeModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
      >
        &times;
      </button>

      <h3 class="text-xl font-bold mb-6">Update Shipment Status</h3>
      <form (ngSubmit)="UpdateShipmentStatus()" class="space-y-4">
        <!-- Status Dropdown -->
        <div>
          <label class="block text-sm font-bold text-gray-1000 mb-1">Status</label>
          <select
            [(ngModel)]="shipmentModel.status"
            name="status"
            class="w-full border rounded-lg p-2"
            required
          >
            <option value="" disabled selected>Select status</option>
            <option *ngFor="let s of shipmentStatuses" [value]="s">{{ s }}</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-4 mt-4">
          <button
            type="button"
            (click)="closeModal()"
            class="px-4 py-2 border rounded-lg text-gray-700 hover:bg-gray-100"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
          >
            Update Status
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
