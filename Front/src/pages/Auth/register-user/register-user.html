<app-photo imgSrc="/assets/images/bgPhoto.svg">
  <div
    class="flex flex-col lg:flex-row items-center justify-between px-10 md:px-20 lg:px-32 font-sans w-full min-h-screen gap-10 py-10"
  >
    <div class="hidden lg:flex flex-col space-y-6 max-w-xl text-left animate-fade-in">
      <div
        class="flex gap-4 pt-4 italic text-blue-400 font-bold text-xs uppercase tracking-widest opacity-60"
      >
        <span>Reliability</span> • <span>Scalability</span> • <span>Isolation</span>
      </div>
    </div>

    <div class="w-full lg:max-w-lg flex justify-end">
      <div
        class="w-full bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-2xl shadow-black/20 overflow-hidden border border-white/40"
      >
        <div class="bg-slate-900/90 py-12 text-center">
          <h2 class="text-4xl font-black text-white tracking-tighter italic">SaaS Manager</h2>
          <p class="text-blue-400 mt-3 text-[10px] uppercase tracking-[0.4em] font-bold opacity-80">
            Secure Access Portal
          </p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-10 lg:p-12 space-y-8">
          <div class="space-y-4">
            <label class="block text-xs font-black uppercase tracking-[0.15em] ml-2 text-slate-600"
              >Corporate Email</label
            >
            <div class="relative group">
              <span
                class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 group-focus-within:text-blue-600 transition-all duration-300"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                  />
                </svg>
              </span>
              <input
                type="email"
                formControlName="email"
                class="w-full pl-14 pr-6 py-5 bg-white/50 border border-slate-200/60 rounded-2xl focus:bg-white focus:ring-8 focus:ring-blue-500/5 focus:border-blue-500 transition-all duration-300 outline-none text-slate-700 font-medium text-lg placeholder:text-slate-300 shadow-sm"
                placeholder="name@company.com"
              />
            </div>
          </div>

          <div class="space-y-4">
            <label class="block text-xs font-black uppercase tracking-[0.15em] ml-2 text-slate-600"
              >Secure Password</label
            >
            <div class="relative group">
              <span
                class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 group-focus-within:text-blue-600 transition-all duration-300"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  />
                </svg>
              </span>
              <input
                type="password"
                formControlName="password"
                class="w-full pl-14 pr-6 py-5 bg-white/50 border border-slate-200/60 rounded-2xl focus:bg-white focus:ring-8 focus:ring-blue-500/5 focus:border-blue-500 transition-all duration-300 outline-none text-slate-700 font-medium text-lg placeholder:text-slate-300 shadow-sm"
                placeholder="••••••••"
              />
            </div>
          </div>

          <div class="pt-2">
            <button
              type="submit"
              [disabled]="form.invalid"
              class="w-full py-5 bg-slate-900 hover:bg-blue-600 disabled:bg-slate-200 text-white font-black rounded-2xl transition-all duration-500 shadow-xl shadow-slate-900/10 hover:shadow-blue-500/30 active:scale-[0.97] uppercase tracking-[0.3em] text-sm"
            >
              Register
            </button>
          </div>
          <div class="pt-6 border-t border-black-300 flex flex-col items-center space-y-4">
            <div class="pt-6 flex flex-col items-center space-y-4">
              <span class="text-[13px] font-black uppercase tracking-[0.2em] text-shadow-black-700">
                Registration Type
              </span>

              <div class="grid grid-cols-2 w-full gap-2">
                <a
                  routerLink="/register"
                  class="flex flex-col items-center p-3 rounded-xl border border-slate-100 hover:border-blue-500/30 hover:bg-blue-50/50 transition-all group"
                >
                  <span
                    class="text-slate-400 group-hover:text-blue-600 text-[11px] font-black uppercase tracking-wider transition-colors"
                    >Tenant Admin</span
                  >
                  <span
                    class="text-[8px] text-slate-300 group-hover:text-slate-400 font-bold uppercase tracking-tight transition-colors"
                    >Setup Workspace</span
                  >
                </a>

                <div
                  class="flex flex-col items-center p-3 rounded-xl border-2 border-blue-600 bg-blue-50/30 cursor-default relative"
                >
                  <span
                    class="absolute -top-2 right-2 px-2 py-0.5 bg-blue-600 text-white text-[7px] font-bold rounded-full uppercase tracking-tighter shadow-lg shadow-blue-500/20"
                    >Active</span
                  >

                  <span class="text-blue-600 text-[11px] font-black uppercase tracking-wider"
                    >System User</span
                  >
                  <span class="text-[8px] text-blue-400 font-bold uppercase tracking-tight"
                    >Join Workspace</span
                  >
                </div>
              </div>

              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pt-2">
                Already have an account?
                <a
                  routerLink="/login"
                  class="text-blue-600 hover:text-blue-800 underline underline-offset-4 decoration-2 transition-all"
                  >Sign In</a
                >
              </p>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</app-photo>
