name: SaaS System CI/CD Pipeline

on:
  push:
    branches: ["PreDeploy"]
  pull_request:
    branches: ["PreDeploy"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"

      - name: Create .env File
        run: |
          touch .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env
          echo "JWT_ISSUER=${{ secrets.JWT_ISSUER }}" >> .env
          echo "JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}" >> .env

          echo "JwtSettings__Key=${{ secrets.JWT_KEY }}" >> .env
          echo "JwtSettings__Issuer=${{ secrets.JWT_ISSUER }}" >> .env
          echo "JwtSettings__Audience=${{ secrets.JWT_AUDIENCE }}" >> .env
          echo "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${{ secrets.DB_NAME }};Username=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Clean Docker System & Force Rebuild
        run: |
          echo -e "\e[33m [!] Purging old images and cache... \e[0m"
          docker system prune -af
          docker compose build --no-cache --pull

      - name: Test Docker Compose Up
        run: |
          echo -e "\e[34m >>> Starting SaaS containers... \e[0m"
          docker compose up -d
          echo "Waiting for services to initialize..."
          sleep 15 
          docker compose ps -a

          EXITED_IDS=$(docker ps -a -f status=exited -q)
          if [ -n "$EXITED_IDS" ]; then
            echo -e "\e[31m [X] ERROR: One or more SaaS containers failed! \e[0m"
            
            echo "::group::Backend (API) Logs"
            docker logs saas-backend-api
            echo "::endgroup::"
            
            echo "::group::Frontend (Angular) Logs"
            docker logs frontend-angular
            echo "::endgroup::"

            echo "::group::Database (Postgres) Logs"
            docker logs saas-postgres-db
            echo "::endgroup::"
            
            exit 1
          fi
          echo -e "\e[32m [V] SUCCESS: All SaaS services are up and healthy! \e[0m"

      - name: Shutdown Test Environment
        run: docker compose down

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push SaaS Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/saas-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/saas-backend:${{ github.sha }}

      - name: Build and Push SaaS Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/saas-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/saas-frontend:${{ github.sha }}
