name: SaaS System CI/CD Pipeline

on:
  push:
    branches: ["PreDeploy"]
  pull_request:
    branches: ["PreDeploy"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"

      - name: Create .env File
        run: |
          touch .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env

          echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env
          echo "JWT_ISSUER=${{ secrets.JWT_ISSUER }}" >> .env
          echo "JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}" >> .env

          echo "SAASADMINDOMAIN=${{ secrets.SAASADMINDOMAIN }}" >> .env
          echo "SYSTEMADMINEMAIL=${{ secrets.SYSTEMADMINEMAIL }}" >> .env
          echo "SYSTEMADMINPASSWORD=${{ secrets.SYSTEMADMINPASSWORD }}" >> .env
      - name: Clean Docker System & Force Rebuild
        run: |
          echo -e "\e[33m [!] Purging old images and cache... \e[0m"
          docker system prune -af
          docker compose build --no-cache --pull
      - name: Test Docker Compose Up & Group Logs
        run: |
          echo -e "\e[34m >>> Starting SaaS containers... \e[0m"
          
          docker compose up -d || echo -e "\e[33m [!] Warning: Some containers failed to start initially. \e[0m"

          echo "Waiting for 20s for services to stabilize..."
          sleep 20

          ALL_CONTAINERS=$(docker ps -a --format '{{.Names}}')

          echo -e "\e[34m >>> Inspecting all containers... \e[0m"
          
          for container in $ALL_CONTAINERS; do
            echo "::group::Logs for $container"

            echo "---- Status Check ----"
            docker inspect "$container" --format='Status: {{.State.Status}} | ExitCode: {{.State.ExitCode}} | Error: {{.State.Error}}' || true

            echo "---- Docker Logs (All) ----"
            docker logs "$container" 2>&1 || true

            echo "---- Inspect State Details ----"
            docker inspect "$container" --format='
            Name: {{.Name}}
            StartedAt: {{.State.StartedAt}}
            FinishedAt: {{.State.FinishedAt}}
            ' || true

            echo "::endgroup::"
          done
          EXITED_COUNT=$(docker ps -a --filter "status=exited" --format '{{.Names}}' | wc -l)
          if [ "$EXITED_COUNT" -gt 0 ]; then
            echo -e "\e[31m [X] ERROR: $EXITED_COUNT container(s) failed. Check the grouped logs above! \e[0m"
            
            echo "::group::Full Docker Compose Logs (Combined)"
            docker compose logs --no-color
            echo "::endgroup::"
            exit 1
          fi
          echo -e "\e[32m [V] SUCCESS: All services are healthy and running. \e[0m"
      - name: Shutdown Test Environment
        run: |
             docker compose down -v
             docker volume rm $(docker volume ls -q) || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push SaaS Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/saas-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/saas-backend:${{ github.sha }}

      - name: Build and Push SaaS Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/saas-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/saas-frontend:${{ github.sha }}
