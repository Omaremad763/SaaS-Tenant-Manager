name: SaaS System CI/CD Pipeline

on:
  push:
    branches: ["PreDeploy"]
  pull_request:
    branches: ["PreDeploy"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"

      - name: Create .env File
        run: |
          touch .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env

          echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env
          echo "JWT_ISSUER=${{ secrets.JWT_ISSUER }}" >> .env
          echo "JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}" >> .env

          echo "SAASADMINDOMAIN=${{ secrets.SAASADMINDOMAIN }}" >> .env
          echo "SYSTEMADMINEMAIL=${{ secrets.SYSTEMADMINEMAIL }}" >> .env
          echo "SYSTEMADMINPASSWORD=${{ secrets.SYSTEMADMINPASSWORD }}" >> .env

      - name: Clean Docker System & Force Rebuild
        run: |
          echo -e "\e[33m [!] Purging old images and cache... \e[0m"
          docker system prune -af
          docker compose build --no-cache --pull

      - name: Test Docker Compose Up & Group Logs
        run: |
          echo -e "\e[34m >>> Starting SaaS containers... \e[0m"
          docker compose up -d

          echo "Waiting for 20s for services to stabilize..."
          sleep 20

          EXITED_CONTAINERS=$(docker ps -a --format '{{.Names}}' --filter "status=exited")

          if [ -n "$EXITED_CONTAINERS" ]; then
            echo -e "\e[31m [X] ERROR: Some containers failed to stay up! \e[0m"
            for container in $(docker compose ps --format '{{.Name}}'); do
            echo "::group::Logs for $container"

            echo "---- Docker Logs ----"
            docker logs "$container" || true

            echo "---- Last 100 lines ----"
            docker logs --tail 100 "$container" || true

            echo "---- Inspect State ----"
            docker inspect "$container" --format='
            Name: {{.Name}}
            Status: {{.State.Status}}
            ExitCode: {{.State.ExitCode}}
            Error: {{.State.Error}}
            StartedAt: {{.State.StartedAt}}
            FinishedAt: {{.State.FinishedAt}}
            ' || true

            echo "::endgroup::"
          done

          echo "::group::Docker Compose Logs (All Services)"
          docker compose logs --no-color
          echo "::endgroup::"
            

            exit 1
          fi

          echo -e "\e[32m [V] SUCCESS: All services are healthy. \e[0m"

      - name: Shutdown Test Environment
        run: docker compose down -V

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push SaaS Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/saas-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/saas-backend:${{ github.sha }}

      - name: Build and Push SaaS Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/saas-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/saas-frontend:${{ github.sha }}
